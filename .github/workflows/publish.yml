name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build and check distribution files
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the installed wheel and release tag
        run: |
          python -m venv "${RUNNER_TEMP}/bench"
          "${RUNNER_TEMP}/bench/bin/python" -m pip install --no-deps dist/*.whl
          bench="${RUNNER_TEMP}/bench/bin/escalation-bench"
          test "$GITHUB_REF_NAME" = "v$("$bench" --version)"
          cd "$RUNNER_TEMP"
          "$bench" verify-data
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/healthcare-escalation-bench/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
