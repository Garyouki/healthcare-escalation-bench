[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-escalation-bench"
version = "0.1.0"
description = "Perturbation-controlled benchmark of when healthcare LLM agents should answer, ask, abstain, or escalate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "DATA_LICENSE.md"]
authors = [
  { name = "Zihao Zheng" },
  { name = "Junyi Yao" },
  { name = "Baichuan Li" },
  { name = "Jiayu Long" },
]
keywords = [
  "llm-agents",
  "healthcare-ai",
  "evaluation",
  "benchmark",
  "escalation",
  "trustworthy-ai",
  "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
reproduce = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]
inspect = ["inspect-ai>=0.3.100"]
dev = ["pytest>=8"]

[project.scripts]
escalation-bench = "escalation_bench.cli:main"

# Lets Inspect find the task by name: inspect eval escalation_bench/healthcare_escalation
[project.entry-points.inspect_ai]
escalation_bench = "escalation_bench"

[project.urls]
Repository = "https://github.com/Garyouki/healthcare-escalation-bench"
Issues = "https://github.com/Garyouki/healthcare-escalation-bench/issues"
Paper = "https://arxiv.org/abs/2610.21270"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
escalation_bench = ["data/*.jsonl", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
